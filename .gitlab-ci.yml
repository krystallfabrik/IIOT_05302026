# Default Docker image to run the jobs
image: node:latest

# Define the order of execution stages
stages:
  - build
  - test
  - deploy

# Define the build job
build-job:
  stage: build
  script:
    - echo "Building the application..."
    - npm install

# Define the test job
test-job:
  stage: test
  script:
    - echo "Running automated tests..."
    - npm test

# Define the deploy job
deploy-job:
  stage: deploy
  script:
    - echo "Deploying to production environment from branch $CI_COMMIT_BRANCH"
  only:
    - main

